proxy_cache_path /var/cache/nginx/calibre-web levels=1:2 keys_zone=calibre:10m max_size=200m inactive=60m;

server {
    listen 127.0.0.1:8084;
    server_name _;
    client_max_body_size 200M;

    # ── 登录鉴权子请求（复用 Calibre-Web 会话） ──────────────────
    # 子请求到 Calibre-Web，返回 200=已登录，302=未登录
    location = /_auth_check {
        internal;
        proxy_pass http://127.0.0.1:8083/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Content-Type "";
        proxy_set_header Cookie $http_cookie;
        proxy_method GET;
    }

    # 未登录时重定向到 Calibre-Web 登录页
    error_page 500 = @login_redirect;
    location @login_redirect {
        return 302 /login?next=$request_uri;
    }

    # ── 静态资源（公开，页面渲染依赖） ──────────────────────────
    location ~* \.(css|js|woff|woff2|ttf|svg|ico|map)$ {
        proxy_pass http://127.0.0.1:8083;
        proxy_cache calibre;
        proxy_cache_valid 200 30m;
        proxy_cache_valid 404 1m;
        proxy_ignore_headers Set-Cookie Vary Cache-Control;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Vary;
        proxy_cache_key $scheme$proxy_host$uri;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ── 封面图片缓存（Calibre-Web @login_required_if_no_ano 保护） ──
    location /cover/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_cache calibre;
        proxy_cache_valid 200 60m;
        proxy_cache_valid 404 5m;
        proxy_ignore_headers Set-Cookie Vary Cache-Control;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Vary;
        proxy_cache_key $scheme$proxy_host$uri;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ── 上传（Calibre-Web 自带 @user_login_required 鉴权） ──────
    location /upload {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # ── 异步上传页面（nginx 鉴权门禁） ──────────────────────────
    location /async-upload {
        auth_request /_auth_check;
        alias /opt/calibre-stack/async-upload/upload_page.html;
        default_type text/html;
    }

    # ── 任务看板（nginx 鉴权门禁） ──────────────────────────────
    location /tasks {
        auth_request /_auth_check;
        proxy_pass http://127.0.0.1:8086/tasks;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # ── 异步上传 API（nginx 鉴权门禁） ──────────────────────────
    location /api/ {
        auth_request /_auth_check;
        proxy_pass http://127.0.0.1:8086;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_request_buffering off;
        client_max_body_size 200M;
    }

    # ── 兜底（Calibre-Web 全部路由，自带鉴权） ──────────────────
    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
