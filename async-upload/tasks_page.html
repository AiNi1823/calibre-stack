<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上传任务 · Calibre</title>
    <link rel="stylesheet" href="/static/css/tailwind.css">
    <style>
        body { background: rgb(var(--background) / 100%); color: rgb(var(--text-primary)); }
        .cw-wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
        .cw-page-title { font-size: 18px; font-weight: 600; color: rgb(var(--text-primary)); }
        .status-chip { display:inline-block; padding:2px 10px; border-radius:9999px; font-size:12px; font-weight:600; }
        .s-success { background: rgb(var(--success) / 12%); color: rgb(var(--success)); }
        .s-running, .s-pending { background: rgb(var(--primary) / 12%); color: rgb(var(--primary)); }
        .s-failed { background: rgb(var(--danger) / 12%); color: rgb(var(--danger)); }
        .s-cancelled { background: rgb(var(--surface-secondary)); color: rgb(var(--text-secondary)); }
        .detail-cell { max-width: 320px; word-break: break-all; color: rgb(var(--text-secondary)); font-size: 13px; }
        .empty { text-align:center; color: rgb(var(--text-muted)); padding:40px 0; }
        .theme-toggle { background:none; border:1px solid rgb(var(--border)); color:rgb(var(--text-secondary));
                        border-radius:6px; padding:4px 10px; font-size:13px; cursor:pointer; }
        .theme-toggle:hover { background: rgb(var(--surface-secondary)); }
    </style>
</head>
<body style="padding:20px 0 60px;">
<div class="cw-wrap">
    <div class="flex items-center justify-between gap-3 mb-4">
        <a href="/" class="cw-btn cw-btn--secondary cw-btn--sm">&larr; 返回书库</a>
        <div class="flex items-center gap-2">
            <a href="/async-upload" class="cw-btn cw-btn--secondary cw-btn--sm">上传页面</a>
            <button id="scanBtn" class="cw-btn cw-btn--sm">全库扫描</button>
            <button id="themeBtn" class="theme-toggle" type="button">主题</button>
        </div>
    </div>
    <div id="counts" class="cw-caption mb-3"></div>

    <div class="cw-card">
        <div class="flex items-center justify-between px-4 py-2 border-b" style="border-color: rgb(var(--border));">
            <strong class="cw-page-title">上传 / 处理任务</strong>
            <span class="cw-caption">每 5 秒自动刷新</span>
        </div>
        <div class="overflow-x-auto">
            <table class="cw-table">
                <thead>
                    <tr>
                        <th>#</th><th>标题</th><th>源文件</th>
                        <th>阶段</th><th>状态</th><th>详情</th><th>操作</th>
                    </tr>
                </thead>
                <tbody id="taskRows">
                    <tr><td colspan="7" class="empty">加载中…</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
const STAGE_CN = {
    uploaded: '已接收', adding: '加入书库', converting: '转 EPUB',
    enriching: '补全信息', searching_epub: '搜索 EPUB', deduping: '去重',
    done: '完成', scan: '扫描'
};
const STATUS_CN = {
    pending: '排队中', running: '处理中', success: '成功',
    failed: '失败', cancelled: '已取消'
};

function statusClass(s){ return 'status-chip s-' + s; }

function renderTasks(tasks){
    const tbody = document.getElementById('taskRows');
    if(!tasks.length){
        tbody.innerHTML = '<tr><td colspan="7" class="empty">暂无任务</td></tr>';
        return;
    }
    tbody.innerHTML = tasks.map(t => {
        const stage = STAGE_CN[t.stage] || t.stage;
        const status = STATUS_CN[t.status] || t.status;
        const detail = (t.detail || '').replace(/</g,'&lt;');
        let ops = '';
        if(t.book_id){
            ops = `<a class="cw-btn cw-btn--secondary cw-btn--sm" href="/book/${t.book_id}" target="_blank">查看</a>`;
        }
        if(t.status === 'failed'){
            ops = `<button class="cw-btn cw-btn--danger cw-btn--sm" onclick="retry(${t.id})">重试</button> ` + ops;
        }
        return `<tr>
            <td>${t.id}</td>
            <td>${t.title}</td>
            <td class="detail-cell">${t.source_file||''}</td>
            <td>${stage}</td>
            <td><span class="${statusClass(t.status)}">${status}</span></td>
            <td class="detail-cell">${detail}</td>
            <td>${ops}</td>
        </tr>`;
    }).join('');
}

function load(){
    fetch('/api/tasks').then(r => r.json()).then(d => {
        renderTasks(d.tasks || []);
        const c = d.counts || {};
        const parts = Object.keys(c).map(k => `${STATUS_CN[k]||k}: ${c[k]}`);
        document.getElementById('counts').textContent = parts.join('  ') || '无任务';
    }).catch(() => {});
}

function retry(id){
    fetch('/api/tasks/' + id + '/retry', {method:'POST'}).then(() => load());
}

document.getElementById('scanBtn').addEventListener('click', () => {
    fetch('/api/scan', {method:'POST'}).then(() => {
        document.getElementById('scanBtn').textContent = '已触发';
        setTimeout(() => document.getElementById('scanBtn').textContent = '全库扫描', 2000);
    });
});

document.getElementById('themeBtn').addEventListener('click', () => {
    const root = document.documentElement;
    const dark = root.classList.toggle('dark');
    try { localStorage.setItem('calibre-theme', dark ? 'dark' : 'light'); } catch(e) {}
});
(function(){
    const STORE = 'calibre-theme';
    const apply = t => document.documentElement.classList.toggle('dark', t === 'dark');
    let saved = null;
    try { saved = window.localStorage.getItem(STORE); } catch(e) {}
    if (saved === 'dark' || saved === 'light') apply(saved);
    else apply(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
})();

load();
setInterval(load, 5000);
</script>
</body>
</html>
