proxy_cache_path /var/cache/nginx/calibre-web levels=1:2 keys_zone=calibre:10m max_size=200m inactive=60m;

server {
    listen 127.0.0.1:8084;
    server_name _;
    client_max_body_size 100M;

    # 静态资源缓存
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
        proxy_pass http://127.0.0.1:8083;
        proxy_cache calibre;
        proxy_cache_valid 200 30m;
        proxy_cache_valid 404 1m;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # 封面图片缓存（核心加速）
    location /cover/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_cache calibre;
        proxy_cache_valid 200 60m;
        proxy_cache_valid 404 5m;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # 缩略图缓存
    location /thumb/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_cache calibre;
        proxy_cache_valid 200 60m;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # 上传请求（超时时间更长）
    location /upload {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # 异步上传页面
    location /async-upload {
        alias /opt/calibre-stack/async-upload/upload_page.html;
        default_type text/html;
    }

    # 异步上传 API
    location /api/upload {
        proxy_pass http://127.0.0.1:8086/upload;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_request_buffering off;
        client_max_body_size 100M;
    }

    # 其他请求代理
    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
