<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上传任务 · Calibre</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/bootstrap-theme.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body { padding: 20px 0 60px; background: #f0f0f0; }
        .cw-container { max-width: 1000px; margin: 0 auto; padding: 0 15px; }
        .panel { border-radius: 4px; }
        .status-chip { display:inline-block; padding:2px 10px; border-radius:12px; font-size:12px; font-weight:600; }
        .s-success { background:#d4edda; color:#155724; }
        .s-running, .s-pending { background:#cce5ff; color:#004085; }
        .s-failed { background:#f8d7da; color:#721c24; }
        .s-cancelled { background:#e2e3e5; color:#383d41; }
        .detail-cell { max-width: 320px; word-break: break-all; color:#666; font-size:13px; }
        .nav-bar { margin-bottom: 20px; }
        .nav-bar a { margin-right: 18px; }
        .empty { text-align:center; color:#999; padding:40px 0; }
    </style>
</head>
<body>
<div class="cw-container">
    <div class="nav-bar">
        <a href="/" class="btn btn-default btn-sm">&larr; 返回书库</a>
        <a href="/async-upload" class="btn btn-default btn-sm">上传页面</a>
        <button id="scanBtn" class="btn btn-primary btn-sm">全库扫描</button>
        <span id="counts" class="label label-default" style="margin-left:10px;"></span>
    </div>

    <div class="panel panel-default">
        <div class="panel-heading"><strong>上传 / 处理任务</strong>
            <span class="pull-right" style="color:#999; font-weight:normal;">每 5 秒自动刷新</span>
        </div>
        <div class="panel-body" style="padding:0;">
            <div class="table-responsive">
                <table class="table table-striped table-hover" style="margin-bottom:0;">
                    <thead>
                        <tr>
                            <th>#</th><th>标题</th><th>源文件</th>
                            <th>阶段</th><th>状态</th><th>详情</th><th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="taskRows">
                        <tr><td colspan="7" class="empty">加载中…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
const STAGE_CN = {
    uploaded: '已接收', adding: '加入书库', converting: '转 EPUB',
    enriching: '补全信息', searching_epub: '搜索 EPUB', deduping: '去重',
    done: '完成', scan: '扫描'
};
const STATUS_CN = {
    pending: '排队中', running: '处理中', success: '成功',
    failed: '失败', cancelled: '已取消'
};

function statusClass(s){ return 'status-chip s-' + s; }

function renderTasks(tasks){
    const tbody = document.getElementById('taskRows');
    if(!tasks.length){
        tbody.innerHTML = '<tr><td colspan="7" class="empty">暂无任务</td></tr>';
        return;
    }
    tbody.innerHTML = tasks.map(t => {
        const stage = STAGE_CN[t.stage] || t.stage;
        const status = STATUS_CN[t.status] || t.status;
        const detail = (t.detail || '').replace(/</g,'&lt;');
        let ops = '';
        if(t.book_id){
            ops = `<a class="btn btn-xs btn-default" href="/book/${t.book_id}" target="_blank">查看</a>`;
        }
        if(t.status === 'failed'){
            ops = `<button class="btn btn-xs btn-warning" onclick="retry(${t.id})">重试</button> ` + ops;
        }
        return `<tr>
            <td>${t.id}</td>
            <td>${t.title}</td>
            <td class="detail-cell">${t.source_file||''}</td>
            <td>${stage}</td>
            <td><span class="${statusClass(t.status)}">${status}</span></td>
            <td class="detail-cell">${detail}</td>
            <td>${ops}</td>
        </tr>`;
    }).join('');
}

function load(){
    fetch('/api/tasks').then(r => r.json()).then(d => {
        renderTasks(d.tasks || []);
        const c = d.counts || {};
        const parts = Object.keys(c).map(k => `${STATUS_CN[k]||k}: ${c[k]}`);
        document.getElementById('counts').textContent = parts.join('  ') || '无任务';
    }).catch(() => {});
}

function retry(id){
    fetch('/api/tasks/' + id + '/retry', {method:'POST'}).then(() => load());
}

document.getElementById('scanBtn').addEventListener('click', () => {
    fetch('/api/scan', {method:'POST'}).then(() => {
        document.getElementById('scanBtn').textContent = '已触发';
        setTimeout(() => document.getElementById('scanBtn').textContent = '全库扫描', 2000);
    });
});

load();
setInterval(load, 5000);
</script>
</body>
</html>
