<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calibre 异步上传</title>
    <link rel="stylesheet" href="/static/css/tailwind.css">
    <style>
        body { background: rgb(var(--background) / 100%); color: rgb(var(--text-primary)); padding: 24px 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .cw-wrap { max-width: 620px; margin: 0 auto; }
        .upload-zone { border: 2px dashed rgb(var(--border)); border-radius: 8px; padding: 40px; text-align: center; cursor: pointer; transition: all .2s; }
        .upload-zone:hover, .upload-zone.dragover { border-color: rgb(var(--primary)); background: rgb(var(--primary) / 6%); }
        .upload-zone p { color: rgb(var(--text-secondary)); margin-bottom: 10px; }
        .upload-zone .hint { font-size: 14px; color: rgb(var(--text-muted)); }
        #fileInput { display: none; }
        .progress { margin-top: 20px; display: none; }
        .progress-track { height: 12px; background: rgb(var(--surface-secondary)); border-radius: 6px; overflow: hidden; }
        .progress-bar { height: 100%; background: rgb(var(--primary)); border-radius: 6px; transition: width .2s; width: 0%; }
        .progress-text { margin-top: 8px; font-size: 14px; color: rgb(var(--text-secondary)); }
        .result { margin-top: 20px; padding: 15px; border-radius: 6px; display: none; font-size: 14px; }
        .result.success { background: rgb(var(--success) / 10%); color: rgb(var(--success)); }
        .result.error { background: rgb(var(--danger) / 10%); color: rgb(var(--danger)); }
        .file-list { margin-top: 15px; text-align: left; }
        .file-item { padding: 8px 12px; background: rgb(var(--surface-secondary)); border-radius: 6px; margin-bottom: 5px; font-size: 14px; display: flex; justify-content: space-between; color: rgb(var(--text-primary)); }
        .theme-toggle { background:none; border:1px solid rgb(var(--border)); color:rgb(var(--text-secondary)); border-radius:6px; padding:4px 10px; font-size:13px; cursor:pointer; }
        .theme-toggle:hover { background: rgb(var(--surface-secondary)); }
    </style>
</head>
<body>
    <div class="cw-wrap">
        <div class="flex items-center justify-between mb-4">
            <h1 class="cw-title">📚 Calibre 异步上传</h1>
            <button id="themeBtn" class="theme-toggle" type="button">主题</button>
        </div>
        <p class="cw-caption" style="margin-bottom:20px;">文件上传后立即返回，后台自动添加到书库</p>

        <div class="cw-card" style="padding:16px;">
            <div class="upload-zone" id="dropZone">
                <p>拖拽文件到这里，或点击选择</p>
                <p class="hint">支持 epub, pdf, mobi, azw3, cbz, txt, docx 等格式 · 单次上限 200MB</p>
                <input type="file" id="fileInput" multiple accept=".epub,.pdf,.mobi,.azw,.azw3,.cbz,.cbr,.txt,.docx,.fb2,.kepub,.djvu">
            </div>

            <div style="text-align: center; margin-top:16px;">
                <button class="cw-btn cw-btn--primary cw-btn--lg" id="uploadBtn" disabled>开始上传</button>
            </div>

            <div class="progress" id="progress">
                <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
                <div class="progress-text" id="progressText">准备中...</div>
            </div>

            <div class="result" id="result"></div>

            <div class="file-list" id="fileList"></div>
        </div>

        <div style="margin-top:20px; text-align:center;">
            <a class="cw-btn cw-btn--secondary cw-btn--sm" href="/tasks">任务中心</a>
            <a class="cw-btn cw-btn--secondary cw-btn--sm" href="/" target="_blank">← 返回 Calibre-Web</a>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const progress = document.getElementById('progress');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const result = document.getElementById('result');
        const fileList = document.getElementById('fileList');

        let selectedFiles = [];

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        function handleFiles(files) {
            selectedFiles = Array.from(files);
            fileList.innerHTML = '';
            selectedFiles.forEach(f => {
                const size = (f.size / 1024 / 1024).toFixed(2);
                fileList.innerHTML += `<div class="file-item"><span>${f.name}</span><span>${size} MB</span></div>`;
            });
            uploadBtn.disabled = selectedFiles.length === 0;
        }

        uploadBtn.addEventListener('click', () => {
            if (selectedFiles.length === 0) return;

            const formData = new FormData();
            selectedFiles.forEach(f => formData.append('files', f));

            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/upload', true);

            progress.style.display = 'block';
            result.style.display = 'none';
            uploadBtn.disabled = true;

            xhr.upload.addEventListener('progress', (e) => {
                if (e.lengthComputable) {
                    const pct = Math.round((e.loaded / e.total) * 100);
                    progressBar.style.width = pct + '%';
                    progressText.textContent = `上传中... ${pct}%`;
                }
            });

            xhr.addEventListener('load', () => {
                if (xhr.status === 200) {
                    const resp = JSON.parse(xhr.responseText);
                    progressBar.style.width = '100%';
                    progressBar.style.background = 'rgb(var(--success))';
                    progressText.textContent = '上传完成，后台处理中...';
                    result.className = 'result success';
                    result.innerHTML = `✅ ${resp.message}<br>文件: ${resp.files.join(', ')}<br><br>书籍将在处理完成后自动出现在 Calibre-Web 中。`;
                    result.style.display = 'block';
                } else {
                    result.className = 'result error';
                    result.innerHTML = `❌ 上传失败: ${xhr.statusText}`;
                    result.style.display = 'block';
                    progressText.textContent = '上传失败';
                }
                uploadBtn.disabled = false;
            });

            xhr.addEventListener('error', () => {
                result.className = 'result error';
                result.innerHTML = '⚠️ 上传可能已成功（连接中断）。<br>请<a href="/" target="_blank">刷新书库</a>查看，如未出现请重试。';
                result.style.display = 'block';
                uploadBtn.disabled = false;
                progressText.textContent = '连接中断，请确认书库';
            });

            xhr.send(formData);
        });

        document.getElementById('themeBtn').addEventListener('click', () => {
            const root = document.documentElement;
            const dark = root.classList.toggle('dark');
            try { localStorage.setItem('calibre-theme', dark ? 'dark' : 'light'); } catch(e) {}
        });
        (function(){
            const STORE = 'calibre-theme';
            const apply = t => document.documentElement.classList.toggle('dark', t === 'dark');
            let saved = null;
            try { saved = window.localStorage.getItem(STORE); } catch(e) {}
            if (saved === 'dark' || saved === 'light') apply(saved);
            else apply(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        })();
    </script>
</body>
</html>
